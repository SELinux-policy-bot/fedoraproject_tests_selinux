- hosts: localhost
  tags:
    - classic

  pre_tasks:
    - name: Generate list of tests in this PR
      shell: |
          git log --format= --stat --name-only origin/master..HEAD | sed '/\//!d;s#\(.*\)/.*#\1#' | sort -u | xargs
      delegate_to: localhost
      register: tests_list

    - name: set fact foo
      set_fact:
        tests: "{{ tests_list.stdout.split(' ') }}"

  roles:
  - role: standard-test-beakerlib
